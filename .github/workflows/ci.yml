name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Unit tests
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Race detector
        run: go test -race ./...

      - name: Verify corpus
        run: go run ./cmd/tbgen --verify

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          mkdir -p bin
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -trimpath \
            -ldflags "-s -w -X github.com/petealeon/tbible/v2/internal/version.Version=ci" \
            -o "bin/tbible-${GOOS}-${GOARCH}${ext}" ./cmd/tbible

      - uses: actions/upload-artifact@v4
        with:
          name: tbible-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/tbible-*

  dist:
    name: Release archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archives
        run: make dist VERSION=2.1.0

      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c tbible-2.1.0-checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: tbible-release-archives
          path: dist/*
